<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex-Arena</title>
    <meta name="description" content="Play Apex-Arena now!">
    <meta name="author" content="Ralph Broekaart">
    <link rel="icon" type="icon" href="assets/logos/apex-arena.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ================================================================
  CORE SCRIPTS
  Everything here MUST ship with the client itself — it's what
  bootstraps and fetches everything else. Nothing else lives here
  anymore: welcome/home (and every future page)'s HTML, CSS, and JS
  now live in the assets repo and are injected by cache.js's
  applyStyles()/applyHTML()/applyScripts(), called from loading.js
  once syncAssets() succeeds. See engineering notes for the full
  core-vs-assets boundary.
================================================================= -->
    <script src="js/router.js"></script>
    <script src="js/pages/loading.js"></script>
    <script src="js/notification.js"></script>

<!-- ================================================================
    NOTIFICATIONS  →  Toast + Modal (global, works on any page)
    Core: loading.js itself depends on this for failure reporting,
    before any page has loaded.
================================================================= -->
    <div id="notification-toast" class="notification-toast" hidden>
        <p id="notification-toast-text"></p>
    </div>

    <div id="notification-modal-overlay" class="notification-modal-overlay" hidden>
        <div id="notification-modal" class="notification-modal">
            <h3 id="notification-modal-title">Notice</h3>
            <p id="notification-modal-text"></p>
            <button id="notification-modal-button">OK</button>
        </div>
    </div>

    <div class="page-container">
<!-- ================================================================
  LOADING  →  #loading
  Core: this is the ONLY page whose markup stays in index.html — it
  has to be visible before a single asset has been fetched, or the
  player sees an empty white screen while cache.js is still working.
  Every other page gets appended into .page-container below this one,
  at runtime, by applyHTML().
================================================================= -->
        <div id="loading-screen" class="page">
            <img data-asset="assets/backgrounds/loading.png" src="assets/backgrounds/loading.png" alt="" id="loading-screen-image">
            <img src="assets/logos/apex-arena.png" alt="Logo" id="loading-screen-logo">
            <div id="loading-screen-content">
                <h1 id="loading-screen-title">Loading</h1>
                <h3 id="loading-screen-detail">Starting application</h3>
                <div id="loading-screen-bar">
                    <div id="loading-screen-bar-fill"></div>
                    <h1 id="loading-screen-percentage">0%</h1>
                </div>
            </div>
            <div id="loading-screen-disclaimer-fade"></div>
            <p id="loading-screen-disclaimer">This is a test game. Everything you see is still work in progress. ©Apex Arena</p>
            <div id="loading-screen-notification" hidden>
                <h3 id="loading-screen-notification-title">Notification</h3>
                <p  id="loading-screen-notification-description">Notification description</p>
                <p  id="loading-screen-notification-time">Notification end</p>
                <img alt="" id="loading-screen-notification-img">
            </div>
        </div>
        <!-- welcome-screen, home-screen, and every future page get
             appended here at runtime by cache.js's applyHTML() -->
    </div>
</body>
</html>
