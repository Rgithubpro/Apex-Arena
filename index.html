<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apex-Arena</title>
    <meta name="description" content="Play Apex-Arena now!">
    <meta name="author" content="Ralph Broekaart">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0d111f">

    <!-- Preconnect to Backend API -->
    <link rel="preconnect" href="https://apex-arena-database-server.onrender.com/ping" crossorigin>

    <!-- Social Media Open Graph Tags -->
    <meta property="og:title" content="Apex-Arena">
    <meta property="og:description" content="Play Apex-Arena now!">
    <meta property="og:image" content="assets/icons/apex-arena.png">
    <meta property="og:url" content="https://rgithubpro.github.io/Apex-Arena/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Preload Critical Assets -->
    <link rel="preload" href="assets/fonts/LilitaOne-Regular.woff2" as="font" type="font/woff2" crossorigin>

    <!-- PWA Registration Script (External) -->
    <script>
        if (typeof navigator.serviceWorker !== 'undefined') {
            navigator.serviceWorker.register('service-worker.js')
        }
    </script>

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">

    <!-- Standard Favicons (Browser Tabs) -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/fav-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/fav-32.png">
    <link rel="icon" type="image/svg+xml" href="assets/icons/apex-arena.svg">

    <!-- iOS / Apple Touch Icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Apex-Arena">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152.png">
    <link rel="apple-touch-startup-image" href="assets/icons/apex-arena.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">

    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#0d111f">
    <meta name="msapplication-TileImage" content="assets/icons/icon-144.png">
    <meta name="msapplication-config" content="browserconfig.xml">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ================================================================
  CORE SCRIPTS
================================================================= -->
    <script src="js/router.js"></script>
    <script src="js/pages/loading.js"></script>
    <script src="js/notification.js"></script>
    <script type="module" src="js/errors.js"></script>

<!-- ================================================================
    NOTIFICATIONS  →  Toast + Modal
================================================================= -->
    <div id="notification-toast" class="notification-toast" hidden>
        <p id="notification-toast-text"></p>
    </div>

    <div id="notification-modal-overlay" class="notification-modal-overlay" hidden>
        <div id="notification-modal" class="notification-modal">
            <h3 id="notification-modal-title">Notice</h3>
            <p id="notification-modal-text"></p>
            <div id="notification-modal-incident" class="notification-modal-incident" hidden>
                <span>Reference ID</span>
                <code id="notification-modal-incident-id"></code>
                <button id="notification-modal-copy" type="button">Copy ID</button>
                <a id="notification-modal-report" target="_blank" rel="noopener noreferrer">Report on GitHub</a>
            </div>
            <button id="notification-modal-button">OK</button>
        </div>
    </div>

    <div class="page-container">
<!-- ================================================================
  LOADING  →  #loading
================================================================= -->
        <div id="loading-screen" class="page">
            <img data-asset="assets/backgrounds/loading.png" src="assets/backgrounds/loading.png" alt="" id="loading-screen-image">
            <img src="assets/icons/apex-arena.png" alt="Logo" id="loading-screen-logo">
            <div id="loading-screen-content">
                <h1 id="loading-screen-title">Loading</h1>
                <h3 id="loading-screen-detail">Starting application</h3>
                <div id="loading-screen-bar">
                    <div id="loading-screen-bar-fill"></div>
                    <h1 id="loading-screen-percentage">0%</h1>
                </div>
            </div>
            <div id="loading-screen-disclaimer-fade"></div>
            <p id="loading-screen-disclaimer">This is a test game. Everything you see is still work in progress. ©Apex Arena</p>
            <div id="loading-screen-notification" hidden>
                <h3 id="loading-screen-notification-title">Notification</h3>
                <p  id="loading-screen-notification-description">Notification description</p>
                <p  id="loading-screen-notification-time">Notification end</p>
                <img alt="" id="loading-screen-notification-img">
            </div>
        </div>
    </div>
</body>
</html>
